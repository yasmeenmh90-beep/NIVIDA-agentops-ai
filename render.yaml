services:
  - type: web
    name: agentops-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: CORS_ORIGINS
        sync: false   # your Vercel URL, e.g. https://agentops-ai.vercel.app
